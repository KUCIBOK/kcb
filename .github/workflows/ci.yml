# P5-TEST-002 — CI/CD Kucibok
# Déclencheurs : push ou PR sur main/dev
# Jobs : tests backend, audit sécurité, build frontend
# Gestionnaire de paquets : yarn (jamais npm)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Tests backend (Jest + Supertest)
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-minimum-32-chars-ok!' }}
          API_KEY: ${{ secrets.API_KEY || 'ci-api-key-for-jest' }}
          WALLET_ENCRYPTION_KEY: ${{ secrets.WALLET_ENCRYPTION_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          ADMIN_EMAIL: admin@kucibok-test.com
          MONGODB_URI: mongodb://localhost:27017/kucibok-test
          CORS_ORIGIN: http://localhost:5173
        run: yarn test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Détection de secrets dans le code (Gitleaks)
  # ─────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet pour scanner tous les commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — Audit sécurité yarn (backend + frontend)
  # ─────────────────────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend
        working-directory: backend
        run: yarn audit --level high
        continue-on-error: true   # ne bloque pas le CI, signale seulement

      - name: Audit frontend
        working-directory: frontend
        run: yarn audit --level high
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4 — Build frontend (Vite)
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          # VITE_API_URL doit être /api (relatif) — Vercel proxy redirige vers backend.kucibok.com
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://backend.kucibok.com' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || 'ci-placeholder-key' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '' }}
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
